<!--
  Supabase → Authentication → Emails → "Reset password" (optional, same flow).
  Subject:  Đặt lại mật khẩu nhật ký 🌷
-->
<div style="background:#fbf6ee;padding:32px 16px;font-family:Georgia,'Times New Roman',serif;color:#3b3340">
  <div style="max-width:480px;margin:0 auto;background:#fffdf9;border:1px solid #eadfd2;border-radius:20px;padding:32px">
    <h1 style="font-weight:normal;font-size:24px;margin:0 0 16px">Đặt lại mật khẩu</h1>
    <p style="font-size:17px;line-height:1.7;margin:0 0 24px;color:#6b6070">Bấm nút bên dưới để chọn mật khẩu mới.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/set-password"
       style="display:inline-block;background:#a84a68;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:999px;font-family:Arial,sans-serif;font-size:16px">
      Đặt mật khẩu mới
    </a>
  </div>
</div>
